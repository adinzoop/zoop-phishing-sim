name: Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    name: GLM Security Scan
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          # Cap at 12000 chars to stay within GLM token limit
          head -c 12000 /tmp/pr.diff > /tmp/pr_scan.diff
          echo "Diff size: $(wc -c < /tmp/pr.diff) bytes"

      - name: Scan with GLM 5.3
        id: scan
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          diff = open('/tmp/pr_scan.diff').read().strip()

          if not diff:
              print("No diff — marking as pass")
              with open('/tmp/findings.json', 'w') as f:
                  json.dump([], f)
              with open('/tmp/verdict.txt', 'w') as f:
                  f.write('pass')
              sys.exit(0)

          system = (
              "You are a senior application-security engineer.\n"
              "Analyze the git diff the user provides and return a JSON object with a single key 'findings' containing an array.\n"
              "Each finding must have exactly these fields (no extras):\n"
              '{"title": string, "severity": "critical"|"high"|"medium"|"low"|"info", '
              '"check": "sast"|"secrets"|"iac"|"api-security", '
              '"description": string, "file_path": string|null, "line": number|null, '
              '"owasp_tag": string|null, "exploitable": boolean, '
              '"remediation": string, "evidence": string|null}\n'
              "Only flag lines added in this diff (lines starting with +).\n"
              "Return {\"findings\":[]} if the diff is clean.\n"
              "Respond with valid JSON only — no markdown, no code fences."
          )

          payload = json.dumps({
              "model": "z-ai/glm-5.3-flash",
              "messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": f"Git diff to analyze:\n{diff}"}
              ],
              "temperature": 0.1
          }).encode()

          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/adinzoop/zoop-phishing-sim",
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=90) as resp:
                  data = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              print(f"GLM API error: {e.code} {e.read().decode()}", file=sys.stderr)
              sys.exit(1)

          text = data['choices'][0]['message']['content'].strip()
          # Strip accidental markdown fences
          if text.startswith('```'):
              text = text.split('\n', 1)[1] if '\n' in text else text
              text = text.rstrip('`').strip()

          import re

          # Robust extraction — handles truncated fences and backticks in evidence
          try:
              result = json.loads(text)
          except json.JSONDecodeError:
              match = re.search(r'\{[\s\S]*\}', text)
              if match:
                  result = json.loads(match.group(0))
              else:
                  result = {"findings": []}

          findings = result.get('findings', [])

          verdict = 'pass'
          for f in findings:
              if f.get('severity') in ('critical', 'high') or f.get('exploitable'):
                  verdict = 'fail'
                  break
              elif f.get('severity') in ('medium', 'low', 'info'):
                  verdict = 'neutral'

          # Write to file — avoids backtick/special-char issues with GITHUB_OUTPUT
          with open('/tmp/findings.json', 'w') as f:
              json.dump(findings, f)
          with open('/tmp/verdict.txt', 'w') as f:
              f.write(verdict)

          print(f"Verdict: {verdict} | Findings: {len(findings)}")
          PYEOF
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const findings = JSON.parse(fs.readFileSync('/tmp/findings.json', 'utf8'));
            const verdict  = fs.readFileSync('/tmp/verdict.txt', 'utf8').trim();

            const SEV = { critical: '🔴 CRITICAL', high: '🟠 HIGH', medium: '🟡 MEDIUM', low: '🔵 LOW', info: '⚪ INFO' };

            let body = '';
            if (verdict === 'pass') {
              body = '## ✅ Security Gate — Clean\n\nNo security issues found in this PR.';
            } else {
              const icon = verdict === 'fail' ? '❌' : '⚠️';
              body = `## ${icon} Security Gate — ${findings.length} finding${findings.length !== 1 ? 's' : ''} found\n\n`;
              for (const f of findings) {
                body += `### ${SEV[f.severity] || f.severity} — ${f.title}\n`;
                if (f.file_path) body += `**File:** \`${f.file_path}\`${f.line ? ` · line ${f.line}` : ''}\n`;
                if (f.owasp_tag) body += `**OWASP:** ${f.owasp_tag}\n`;
                body += `\n${f.description}\n\n`;
                if (f.evidence) body += `\`\`\`\n${f.evidence}\n\`\`\`\n\n`;
                body += `**Fix:** ${f.remediation}\n\n---\n\n`;
              }
              body += `*Powered by GLM 5.3-flash via Security Gate*`;
            }

            // Remove previous Security Gate comments to avoid spam
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            for (const c of comments) {
              if (c.body.includes('Security Gate')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
